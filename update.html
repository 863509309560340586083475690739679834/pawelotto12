<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Aktualizacja Bociarki</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .window {
      background: #1e1e1e;
      padding: 30px 40px;
      border-radius: 14px;
      width: 440px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    h2 {
      color: #4caf50;
      font-size: 22px;
      margin-bottom: 12px;
    }

    p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      margin: 10px 6px 5px 6px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #4caf50;
      color: white;
    }

    .btn-primary:hover {
      background: #45a047;
    }

    .btn-secondary {
      background: #555;
      color: white;
    }

    .btn-secondary:hover {
      background: #444;
    }

    .progress-container {
      width: 100%;
      background: #333;
      border-radius: 10px;
      margin-top: 25px;
      height: 22px;
      overflow: hidden;
      display: none;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #81c784);
      width: 0%;
      transition: width 0.2s ease-in-out;
    }

    .progress-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: white;
    }

    .version {
      color: #888;
      font-size: 12px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="window">
    <h2>Nowa aktualizacja dostępna!</h2>
    <p id="info">Dostępna jest nowa wersja programu. Czy chcesz ją teraz pobrać i zainstalować?</p>

    <button id="update" class="btn btn-primary">Tak, zaktualizuj</button>
    <button id="skip" class="btn btn-secondary">Nie, uruchom starą wersję</button>

    <div class="progress-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>

    <div class="version" id="version"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const info = document.getElementById('info');
    const updateBtn = document.getElementById('update');
    const skipBtn = document.getElementById('skip');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    updateBtn.addEventListener('click', () => {
      ipcRenderer.send('start-update');
      progressContainer.style.display = 'block';
      info.innerText = 'Pobieranie aktualizacji...';
      updateBtn.disabled = true;
      skipBtn.disabled = true;
    });

    skipBtn.addEventListener('click', () => {
      ipcRenderer.send('skip-update');
    });

    ipcRenderer.on('update-progress', (event, percent) => {
      progressBar.style.width = percent + '%';
      progressText.textContent = percent + '%';
      if (percent >= 100) {
        info.innerText = 'Instalacja nowej wersji...';
      }
    });

    ipcRenderer.on('update-info', (event, version) => {
      document.getElementById('version').innerText = 'Dostępna wersja: ' + version;
    });
  </script>
</body>
</html>
