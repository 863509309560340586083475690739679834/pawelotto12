<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Aktualizacja aplikacji</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      width: 420px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    h2 {
      color: #4caf50;
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
      font-size: 14px;
    }

    .btn {
      padding: 10px 20px;
      margin: 15px 8px 5px 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #4caf50;
      color: white;
    }

    .btn-primary:hover {
      background: #45a047;
    }

    .btn-secondary {
      background: #555;
      color: white;
    }

    .btn-secondary:hover {
      background: #444;
    }

    .progress-container {
      width: 100%;
      background: #333;
      border-radius: 10px;
      margin-top: 20px;
      height: 20px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      background: #4caf50;
      width: 0%;
      transition: width 0.3s ease;
    }

    .version {
      color: #aaa;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Nowa aktualizacja dostępna!</h2>
    <p id="info">Dostępna jest nowa wersja programu. Czy chcesz ją teraz pobrać i zainstalować?</p>

    <button id="update" class="btn btn-primary">Tak, zaktualizuj</button>
    <button id="skip" class="btn btn-secondary">Nie, uruchom starą wersję</button>

    <div class="progress-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="version" id="version"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // Wysyła sygnał do main.js po kliknięciu
    document.getElementById('update').addEventListener('click', () => {
      ipcRenderer.send('start-update');
      document.getElementById('progress-container').style.display = 'block';
      document.getElementById('info').innerText = 'Pobieranie aktualizacji...';
      document.getElementById('update').disabled = true;
      document.getElementById('skip').disabled = true;
    });

    document.getElementById('skip').addEventListener('click', () => {
      ipcRenderer.send('skip-update');
    });

    // Pasek postępu
    ipcRenderer.on('update-progress', (event, percent) => {
      const bar = document.getElementById('progress-bar');
      bar.style.width = percent + '%';
      if (percent >= 100) {
        document.getElementById('info').innerText = 'Instalacja aktualizacji...';
      }
    });

    // Wersja aktualizacji (opcjonalnie)
    ipcRenderer.on('update-info', (event, version) => {
      document.getElementById('version').innerText = 'Wersja: ' + version;
    });
  </script>
</body>
</html>
